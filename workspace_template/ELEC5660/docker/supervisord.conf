[supervisord]
nodaemon=true

[program:startxfce4]
priority=10
directory=/
command=/usr/bin/startxfce4
autostart=true
autorestart=true
stopsignal=QUIT
environment=DISPLAY=":10",HOME="/",__GLX_VENDOR_LIBRARY_NAME=nvidia,VGL_DISPLAY=:10
stdout_logfile=/var/log/xfce4.log
stderr_logfile=/var/log/xfce4.err

[program:xvfb]
priority=10
directory=/
command=/usr/bin/Xvfb :10 -screen 0 1200x800x24+32 +extension GLX
autostart=true
autorestart=true
stopsignal=QUIT
environment=__GLX_VENDOR_LIBRARY_NAME=nvidia
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb.err

[program:x11vnc]
priority=10
directory=/
# command=x11vnc -display :10 -xkb
command=x11vnc -display :10 -listen localhost -xkb
autostart=true
autorestart=true
stopsignal=QUIT
stdout_logfile=/var/log/x11vnc.log
stderr_logfile=/var/log/x11vnc.err

[include]
files = /system/conf.d/*.conf
